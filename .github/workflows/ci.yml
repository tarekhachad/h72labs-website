name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Matches the Node major Vercel builds with.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The script runs `next typegen` first: PageProps and LayoutProps are
      # generated into .next/, which a fresh checkout doesn't have.
      - run: npm run typecheck

      - run: npm run lint

      # The site is fully static and needs no environment variables, so the
      # build itself is the integration test.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
